name: App Android (APK)

# Roda no Ubuntu, que no plano gratuito consome os minutos na proporção
# 1x — praticamente de graça. O do iOS precisa de macOS e consome 10x,
# por isso ele é manual (ver ios.yml).
on:
  push:
    branches: [main, mobile]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Falha aqui, em 5 segundos e com mensagem clara, em vez de quebrar
      # lá na frente com "supabaseUrl is required".
      - name: Conferir os secrets do Supabase
        run: |
          faltou=0
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "::error::Falta o secret NEXT_PUBLIC_SUPABASE_URL"
            faltou=1
          fi
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Falta o secret NEXT_PUBLIC_SUPABASE_ANON_KEY"
            faltou=1
          fi
          if [ $faltou -eq 1 ]; then
            echo ""
            echo "Cadastre em: Settings > Secrets and variables > Actions"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "Os valores estão no seu arquivo .env.local."
            exit 1
          fi
          echo "Secrets presentes."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # O Capacitor 8 compila contra o Android 36, que nem sempre vem
      # pré-instalado na máquina do GitHub. Esta ação garante o SDK e
      # aceita as licenças — sem ela o Gradle para pedindo confirmação
      # que ninguém pode dar, já que não há teclado no servidor.
      - name: Preparar o Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Instalar dependências
        run: npm ci

      # Este passo é o guarda-costas do app: se alguém adicionar uma API
      # route, um middleware ou um Server Action, o export estático quebra
      # AQUI, de graça, em vez de virar tela branca no celular do aluno.
      - name: Gerar o site estático
        env:
          MOBILE_BUILD: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx next build

      - name: Copiar para o projeto Android
        run: npx cap sync android

      - name: Compilar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ctvh-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
