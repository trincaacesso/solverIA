<!--
  Ícone provisório do CT VH.

  Feito só com formas geométricas, sem texto, de propósito: fonte em SVG
  depende de a fonte existir na máquina que converte, e o ícone sairia
  diferente no PC, no servidor de build e no celular. Formas puras saem
  idênticas em qualquer lugar.

  O raio é o elemento da marca que já aparece no cabeçalho do sistema.
  Substitua este arquivo pela logo real e rode: node scripts/gerar-icones.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f33"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <linearGradient id="raio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- fundo com cantos arredondados; o iOS recorta sozinho -->
  <rect width="512" height="512" fill="url(#fundo)"/>

  <!-- bola de futevôlei, em traço -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#7c3aed" stroke-width="14" opacity="0.35"/>
  <path d="M256 106 C 200 180, 200 332, 256 406" fill="none" stroke="#7c3aed" stroke-width="10" opacity="0.35"/>
  <path d="M256 106 C 312 180, 312 332, 256 406" fill="none" stroke="#7c3aed" stroke-width="10" opacity="0.35"/>
  <path d="M106 256 H 406" fill="none" stroke="#7c3aed" stroke-width="10" opacity="0.35"/>

  <!-- o raio da marca -->
  <polygon
    points="300,84 190,290 250,290 212,428 340,258 268,258"
    fill="url(#raio)"
    stroke="#050308"
    stroke-width="10"
    stroke-linejoin="round"/>

  <!-- linha da areia -->
  <path d="M92 452 H420" stroke="#7c3aed" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
</svg>
